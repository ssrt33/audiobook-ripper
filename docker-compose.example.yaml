# Example stack for Dockge, Portainer or plain `docker compose up -d`.
# Copy to compose.yaml and change the three host paths on the left of each volume.
services:
  audiobook-ripper:
    image: ghcr.io/ssrt33/audiobook-ripper:latest
    # build: .                 # use this instead of image: to build from source
    container_name: audiobook-ripper
    restart: unless-stopped
    ports:
      - "8686:8686"
    devices:
      - /dev/sr0:/dev/sr0       # your optical drive
      # - /dev/sr1:/dev/sr1     # a second drive (also add it to DRIVES)
    # Hot-plug mode (optional): lets the app start with no drive attached and keep going if a USB
    # drive drops out or comes back as /dev/sr1. To use it, delete the devices: block above, add
    # "- /dev:/dev" to volumes below, and uncomment these two rules (CD drives and SCSI generic):
    # device_cgroup_rules:
    #   - "b 11:* rmw"
    #   - "c 21:* rmw"
    environment:
      DRIVES: auto              # or a list like /dev/sr0,/dev/sr1
      PUID: "568"               # owner of written files (568 = TrueNAS "apps")
      PGID: "568"
      TZ: Etc/UTC
      AUTO_EJECT: "true"
      AUTO_START_BOOK: "true"
      KEEP_RIPS: "false"
      DEFAULT_BITRATE: 128k
      DEFAULT_CHANNELS: "2"
      DEFAULT_CHAPTERS: disc
      AUDIBLE_REGION: us
      # NOTIFY_URL: https://ntfy.sh/pick-a-long-random-topic-name
    volumes:
      - /path/to/audiobooks:/audiobooks                # finished books land here
      - /path/to/audiobook-ripper/work:/work           # temporary rips
      - /path/to/audiobook-ripper/config:/config
