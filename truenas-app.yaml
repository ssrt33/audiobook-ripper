# Paste this into TrueNAS: Apps > Discover Apps > Custom App > Install via YAML.
# Change the two /mnt/... paths to your own datasets first.
services:
  audiobook-ripper:
    image: ghcr.io/ssrt33/audiobook-ripper:latest
    container_name: audiobook-ripper
    restart: unless-stopped
    ports:
      - "8686:8686"
    devices:
      - /dev/sr0:/dev/sr0       # your USB/SATA optical drive
      # - /dev/sr1:/dev/sr1     # a second drive, if you have one (also add it to DRIVES)
    # Hot-plug mode (optional): lets the app start with no drive attached and keep going if a USB
    # drive drops out or comes back as /dev/sr1. To use it, delete the devices: block above, add
    # "- /dev:/dev" to volumes below, and uncomment these two rules (CD drives and SCSI generic):
    # device_cgroup_rules:
    #   - "b 11:* rmw"
    #   - "c 21:* rmw"
    environment:
      DRIVES: auto              # or a list like /dev/sr0,/dev/sr1
      PUID: "568"               # TrueNAS "apps" user
      PGID: "568"
      TZ: Etc/UTC
      AUTO_EJECT: "true"
      AUTO_START_BOOK: "true"
      KEEP_RIPS: "false"
      DEFAULT_BITRATE: 128k
      DEFAULT_CHANNELS: "2"
      DEFAULT_CHAPTERS: disc
      AUDIBLE_REGION: us
      # NOTIFY_URL: https://ntfy.sh/pick-a-long-random-topic-name
    volumes:
      - /mnt/tank/audiobooks:/audiobooks              # finished books land here
      - /mnt/tank/apps/audiobook-ripper/work:/work    # temporary rips
      - /mnt/tank/apps/audiobook-ripper/config:/config
